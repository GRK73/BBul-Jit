<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>멀티뷰 로그인 시험</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #eee; font: 14px/1.5 system-ui, sans-serif; }
    header { padding: 16px; border-bottom: 1px solid #222; display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input { flex: 1; min-width: 220px; padding: 8px 10px; border-radius: 8px; border: 1px solid #333; background: #111; color: #eee; }
    button { padding: 8px 12px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #eee; cursor: pointer; }
    button:hover { background: #fff; color: #000; }
    .badge { padding: 2px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
    .ok { background: #0f3d22; color: #7dffa8; }
    .bad { background: #4a1212; color: #ff8d8d; }
    .wait { background: #333; color: #ccc; }
    details { background: #0b0b0b; border: 1px solid #222; border-radius: 8px; padding: 8px 12px; }
    summary { cursor: pointer; font-weight: 700; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
    th, td { border: 1px solid #222; padding: 4px 6px; text-align: left; white-space: nowrap; }
    .scroll { overflow-x: auto; }
    .help { margin: 0; padding: 8px 12px; border-radius: 8px; background: #3a2a00; color: #ffd27a; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: #aaa; }
    main { display: grid; gap: 8px; padding: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); }
    main.page { grid-template-columns: repeat(auto-fit, minmax(min(100%, 720px), 1fr)); }
    .cell { position: relative; aspect-ratio: 16 / 9; background: #0a0a0a; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
    .cell iframe { width: 100%; height: 100%; border: 0; }
    /* 방송 페이지 보기: 데스크톱 크기(1920×1080)로 띄운 뒤 칸에 맞게 통째로 줄인다.
       그대로 좁은 칸에 넣으면 숲이 모바일 화면으로 바꿔 버려서 원래 방송 페이지처럼 보이지 않는다. */
    .cell.page iframe { position: absolute; inset: 0 auto auto 0; width: 1920px; height: 1080px; transform-origin: 0 0; scale: var(--fit, 0.25); }
    .seg { display: inline-flex; border: 1px solid #444; border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; }
    .seg button[aria-pressed="true"] { background: #fff; color: #000; }
    .cell span { position: absolute; left: 8px; top: 8px; font-size: 11px; background: #000a; padding: 2px 8px; border-radius: 999px; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1>멀티뷰 로그인 시험 (0단계)</h1>
    <div class="row">
      확장: <span id="ext" class="badge wait">확인 중…</span>
      숲 원본 로그인: <span id="login" class="badge wait">-</span>
      분할 사본: <span id="copies" class="badge wait">-</span>
      고화질 스트리머 권한: <span id="lna" class="badge wait">-</span>
    </div>
    <p id="lna-help" class="help" hidden>
      이 사이트에서 로컬 네트워크 권한이 차단돼 있어요. 주소창 왼쪽의 사이트 정보 아이콘 → <b>사이트 설정</b>에서
      <b>루프백 네트워크</b>(또는 <b>로컬 네트워크 액세스</b>)를 <b>허용</b>으로 바꾼 뒤 페이지를 새로고침하세요.
    </p>
    <div class="row">
      <input id="ids" placeholder="숲 아이디를 쉼표로 (예: bver99, ch1ch1r0)" />
      <span class="seg" role="group" aria-label="보기 방식">
        <button type="button" data-mode="page" aria-pressed="true">방송 페이지</button>
        <button type="button" data-mode="embed" aria-pressed="false">플레이어만</button>
      </span>
      <button id="apply">플레이어 다시 띄우기</button>
      <button id="resync">쿠키 다시 복사</button>
      <button id="clear">사본 삭제(비교용)</button>
    </div>
    <details>
      <summary>진단 결과 (쿠키 값은 표시하지 않음)</summary>
      <div class="scroll" id="report"></div>
    </details>
  </header>
  <main id="grid"></main>

  <script>
    const $ = id => document.getElementById(id);
    const setBadge = (el, cls, text) => { el.className = `badge ${cls}`; el.textContent = text; };
    const SOOP_ID = /^[a-z0-9_]{3,20}$/i;

    // ---- 확장과 대화 (bridge.js가 같은 창에서 받아 준다) ----
    let extReady = false;
    const pending = {};
    window.addEventListener('message', event => {
      if (event.source !== window || event.origin !== location.origin) return;
      const data = event.data;
      if (!data || data.source !== 'planb-mv-ext') return;
      if (data.type === 'ready') {
        extReady = true;
        setBadge($('ext'), 'ok', `감지됨 v${data.version}`);
      }
      const resolve = pending[data.type];
      if (resolve) { delete pending[data.type]; resolve(data.report); }
    });

    const ask = (type, ms = 4000) => new Promise(resolve => {
      pending[`${type}-result`] = resolve;
      window.postMessage({ source: 'planb-mv-page', type }, location.origin);
      setTimeout(() => {
        if (pending[`${type}-result`]) { delete pending[`${type}-result`]; resolve(null); }
      }, ms);
    });

    // ---- 진단 표 ----
    const table = (title, rows, cols) => {
      const wrap = document.createElement('div');
      const h = document.createElement('p');
      h.textContent = `${title} (${rows.length})`;
      wrap.appendChild(h);
      if (!rows.length) return wrap;
      const t = document.createElement('table');
      const head = t.insertRow();
      cols.forEach(c => { const th = document.createElement('th'); th.textContent = c; head.appendChild(th); });
      rows.forEach(r => {
        const tr = t.insertRow();
        cols.forEach(c => {
          const v = r[c];
          tr.insertCell().textContent = v && typeof v === 'object' ? JSON.stringify(v) : String(v ?? '');
        });
      });
      wrap.appendChild(t);
      return wrap;
    };

    const showReport = report => {
      const box = $('report');
      box.replaceChildren();
      if (!report) {
        box.textContent = '확장 응답 없음';
        return;
      }
      if (!report.ok) {
        setBadge($('copies'), 'bad', '실패');
        box.textContent = `오류: ${report.error}`;
        return;
      }
      setBadge($('login'), report.loggedIn ? 'ok' : 'bad', report.loggedIn ? '로그인됨' : '로그인 안 됨');
      const okWrites = report.writes.filter(w => w.ok).length;
      setBadge($('copies'), report.copies.length ? 'ok' : 'bad', `${report.copies.length}개 (쓰기 성공 ${okWrites}/${report.writes.length})`);

      const meta = document.createElement('pre');
      const stores = (report.stores || []).map(s => `${s.id}(탭 ${s.tabs}개)`).join(', ');
      meta.textContent =
        `topLevelSite: ${report.topLevelSite}\n` +
        `이 탭의 쿠키 저장소: ${report.storeId ?? '?'}${report.incognito ? ' (시크릿 창)' : ''} / 전체 저장소: ${stores || '?'}\n` +
        report.browser;
      box.append(
        meta,
        table('원본 쿠키', report.originals, ['name', 'domain', 'hostOnly', 'path', 'httpOnly', 'secure', 'sameSite', 'session']),
        table('사본 쓰기 시도', report.writes, ['name', 'domain', 'hasCrossSiteAncestor', 'ok', 'error']),
        table('현재 분할 사본', report.copies, ['name', 'domain', 'path', 'httpOnly', 'secure', 'sameSite', 'session', 'partitionKey']),
        table('로그인 쿠키 변경 기록 (최근 40건, 값 없음)', [...(report.events || [])].reverse(), ['time', 'name', 'copy', 'change', 'cause', 'sameSite', 'secure']),
        table('숲 도메인 쿠키 전체 — 모든 저장소·분할 (이름·속성만)', report.soopCookies || [], ['storeId', 'name', 'domain', 'hostOnly', 'path', 'httpOnly', 'secure', 'sameSite', 'session', 'partitionKey'])
      );
      // 로그인 쿠키를 못 찾았으면 진단 표를 펼쳐서 바로 보이게 한다.
      if (!report.loggedIn) box.closest('details').open = true;
    };

    // ---- 플레이어 ----
    const currentIds = () =>
      $('ids').value.split(/[\s,]+/).map(s => s.trim()).filter(id => SOOP_ID.test(id)).slice(0, 6);

    // 보기 방식: page = 숲 방송 페이지 전체(채팅·방송 정보 포함), embed = 플레이어만
    const PAGE_WIDTH = 1920;
    let viewMode = new URLSearchParams(location.search).get('mode') === 'embed' ? 'embed' : 'page';
    const modeButtons = document.querySelectorAll('[data-mode]');
    const showMode = () => modeButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === viewMode)));
    modeButtons.forEach(b => b.addEventListener('click', () => {
      viewMode = b.dataset.mode;
      showMode();
      renderPlayers();
    }));
    showMode();

    // 칸 크기가 바뀔 때마다 데스크톱 크기 방송 페이지를 칸 폭에 맞게 줄인다.
    const setFit = (cell, width) => cell.style.setProperty('--fit', String(width / PAGE_WIDTH));
    const fitObserver = new ResizeObserver(entries => {
      for (const entry of entries) setFit(entry.target, entry.contentRect.width);
    });

    const renderPlayers = () => {
      const ids = currentIds();
      const url = new URL(location.href);
      url.searchParams.set('ids', ids.join(','));
      url.searchParams.set('mode', viewMode);
      history.replaceState(null, '', url);

      fitObserver.disconnect();
      $('grid').classList.toggle('page', viewMode === 'page');
      $('grid').replaceChildren(...ids.map(id => {
        const cell = document.createElement('div');
        cell.className = `cell ${viewMode}`;
        const frame = document.createElement('iframe');
        frame.title = `${id} 방송`;
        frame.src = viewMode === 'page'
          ? `https://play.sooplive.com/${encodeURIComponent(id)}`
          : `https://play.sooplive.com/${encodeURIComponent(id)}/embed`;
        if (viewMode === 'page') fitObserver.observe(cell);
        // 숲 플레이어는 PC에 설치된 SOOP Streamer(고화질 스트리머)에 127.0.0.1 웹소켓으로 붙는다.
        // 크롬의 로컬 네트워크 접근(LNA) 권한은 기본적으로 다른 출처 iframe에 넘어가지 않으므로 여기서 위임한다.
        // loopback-network = 내 PC(127.0.0.1), local-network = 같은 공유기 안의 기기. 크롬 145부터 이 이름을 쓴다.
        frame.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture; loopback-network; local-network';
        frame.allowFullscreen = true;
        const label = document.createElement('span');
        label.textContent = id;
        cell.append(frame, label);
        return cell;
      }));
      // 관찰자는 화면이 그려질 때 알려 주므로, 첫 크기는 배치 직후 바로 맞춰 둔다.
      if (viewMode === 'page') {
        document.querySelectorAll('.cell.page').forEach(cell => setFit(cell, cell.clientWidth));
      }
    };

    const syncThenRender = async () => {
      if (extReady) showReport(await ask('sync'));
      renderPlayers();
    };

    $('apply').onclick = renderPlayers;
    $('resync').onclick = syncThenRender;
    $('clear').onclick = async () => {
      const r = await ask('clear');
      setBadge($('copies'), 'wait', r?.ok ? `삭제함 ${r.removed}개` : '삭제 실패');
      renderPlayers();
    };

    // ---- 고화질 스트리머(로컬 네트워크) 권한 상태 ----
    // 'local-network-access'로 조회하면 옛 크롬이 죽을 수 있어 새 이름만 조회하고, 모르는 이름이면 '확인 불가'로 둔다.
    const showLnaState = state => {
      const label = { granted: '허용됨', prompt: '물어봄', denied: '차단됨' }[state] || '확인 불가';
      setBadge($('lna'), state === 'granted' ? 'ok' : state === 'denied' ? 'bad' : 'wait', label);
      $('lna-help').hidden = state !== 'denied';
    };
    (async () => {
      if (!navigator.permissions?.query) return showLnaState('unknown');
      try {
        const status = await navigator.permissions.query({ name: 'loopback-network' });
        showLnaState(status.state);
        status.addEventListener('change', () => showLnaState(status.state));
      } catch {
        showLnaState('unknown');
      }
    })();

    // ---- 시작: 아이디 채우기 → 확장 기다리기 → 쿠키 복사 → 플레이어 ----
    (async () => {
      const fromUrl = new URLSearchParams(location.search).get('ids');
      if (fromUrl) {
        $('ids').value = fromUrl;
      } else {
        try {
          const res = await fetch('/api/status');
          const live = ((await res.json()).streamers || []).filter(s => s.isLive && SOOP_ID.test(s.id));
          $('ids').value = live.slice(0, 4).map(s => s.id).join(', ') || 'bver99';
        } catch {
          $('ids').value = 'bver99';
        }
      }

      // 확장이 있으면 bridge.js가 곧바로 ready를 보낸다. 잠깐 기다려도 없으면 확장 없이 띄운다.
      for (let i = 0; i < 20 && !extReady; i++) {
        window.postMessage({ source: 'planb-mv-page', type: 'ping' }, location.origin);
        await new Promise(r => setTimeout(r, 50));
      }
      if (!extReady) setBadge($('ext'), 'bad', '없음 (비로그인으로 표시)');
      await syncThenRender();
    })();
  </script>
</body>
</html>
